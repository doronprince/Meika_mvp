services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meika}
      POSTGRES_DB: ${POSTGRES_DB:-meika}
    ports:
      - "5432:5432"
    volumes:
      - meika_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meika} -d ${POSTGRES_DB:-meika}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-meika}:${POSTGRES_PASSWORD:-meika}@postgres:5432/${POSTGRES_DB:-meika}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  meika_pgdata:
