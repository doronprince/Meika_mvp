name: Keep the API awake

# Two free tiers sleep underneath this app: the Render instance (~15 min
# idle, ~30s to wake) and the Neon database (~5 min idle). The health
# endpoint touches both, so pinging it every 5 minutes keeps the pair warm.
# GitHub's schedule is best-effort and can run late, which is fine: the
# cost of a missed ping is one slow first request.
#
# Turn it off from the Actions tab if the service moves to a paid plan or
# the demo is over.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: |
          code=$(curl -s -m 120 -o /tmp/health.json -w "%{http_code}" \
            https://meika-api.onrender.com/api/v1/health || echo "000")
          echo "HTTP $code"
          cat /tmp/health.json || true
          # A sleeping instance that wakes is a success; only a real failure
          # should fail the job.
          [ "$code" = "200" ]
